plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.astrofelyx.pro"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Bu oyun sadece Android icin yapilandirildi (kullanici talebi).
        applicationId "com.astrofelyx.pro"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // android/key.properties varsa GERCEK keystore ile imzalar (Play
            // Store icin sart; debug imzali paket Play'e yuklenemez). Yoksa
            // yerel deneme icin debug imzasi kullanilir.
            signingConfig hasKeystoreProperties ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // --- Appodeal Mobile Ads SDK (eski oyunda canli calisan surumler) ---
    // 4.x'te her ag adaptoru AYRI bagimlilik; eklenmeyen aga istek gitmez.
    // Sadece Appodeal panelinde ACIK olan aglar tutuldu. Panelde baska ag
    // acarsan buraya onun adaptorunu da ekle (docs.appodeal.com Dependencies
    // Wizard).
    implementation "com.appodeal.ads.sdk:core:4.3.0"
    implementation "com.appodeal.ads.sdk.adapters:bidon:0.14.0.0"
    implementation "com.appodeal.ads.sdk.adapters:applovin:13.6.3.0"
    implementation "com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0"
    implementation "com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0"
    implementation "com.appodeal.ads.sdk.adapters:vungle:7.7.4.0"
    implementation "com.appodeal.ads.sdk.adapters:yandex:7.17.0.0"
}
