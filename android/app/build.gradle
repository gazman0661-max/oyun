plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Analytics icin gerekli: android/app/google-services.json
    // dosyasini (Firebase konsolundan indirilen, PROJEYE OZEL/gizli olmayan
    // ama benzersiz kimlikler iceren dosya) okuyup native Android tarafina
    // Firebase konfigurasyonunu enjekte eder. BU DOSYA REPO'DA/ZIP'TE YOK —
    // sen Firebase konsolundan indirip bu dizine (android/app/) KENDIN
    // eklemelisin (ya da GitHub Actions secret'i olarak build sirasinda
    // yazdirmalisin), aksi halde derleme "File google-services.json is
    // missing" hatasiyla BASARISIZ olur.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// AstroFelyx'in yayinda olan surumunu imzalamis oldugun keystore ile
// aynisi kullanilmali (Play Store, guncellemelerde imza uyusmasi arar).
// key.properties dosyasini BU PROJEYE KENDIN eklemen gerekiyor (bu dosya
// ve icindeki sifreler/keystore repo'ya/paylasima dahil edilmemeli).
// Ornek icerik icin android/key.properties.example dosyasina bak.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.astrofelyx.pro"
    // DUZELTME: Onceden `flutter.compileSdkVersion` kullaniliyordu — bu,
    // GitHub Actions'taki Flutter surumunun kendi ICINDE gomulu varsayilan
    // Android SDK degerine baglidir; CI makinesindeki Flutter surumu
    // degisirse (orn. runner image guncellenince) bu deger de SESSIZCE
    // degisebilir. Play Store 31 Agustos 2026'dan itibaren API 36 (Android
    // 16) hedeflemeyi ZORUNLU kildigi icin, CI'nin Flutter surumunden
    // BAGIMSIZ olsun diye SABIT 36 olarak koduyoruz.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // flutter_local_notifications paketi (AAR metadata) core library
        // desugaring'in acik olmasini ZORUNLU kiliyor; kapaliysa
        // ':app:checkDebugAarMetadata' hatasiyla build FAILURE olur.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Bolum/proje kimligi. FlutLab veya "flutter run" bunu degistirmenize
        // gerek kalmadan kullanabilir.
        applicationId "com.astrofelyx.pro"
        // flutter_local_notifications 21+ minimum Android 7.0 (API 24) istiyor.
        minSdk 24
        // Ayni sebeple (bkz. yukaridaki compileSdk notu) SABIT 36.
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // key.properties eklendiyse GERCEK (AstroFelyx'i yayinladigin)
            // keystore ile imzalar. Eklenmediyse HIC IMZALAMAZ (null) —
            // boylece CI'da (GitHub Actions) uretilen .apk/.aab, cmd
            // uzerinden jarsigner/apksigner ile SENIN imzalayabilecegin
            // gercekten imzasiz bir dosya olur. (Debug imzasiyla derlenip
            // sonradan cmd'den yeniden imzalanamaz, o yuzden debug fallback
            // KALDIRILDI.)
            signingConfig hasKeystoreProperties ? signingConfigs.release : null
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Play Games'e giris ve "Saved Games" (bulut kaydi) icin. bkz.
    // MainActivity.kt ve README_PLAY_GAMES.md.
    implementation "com.google.android.gms:play-services-games-v2:20.1.2"
    // coreLibraryDesugaringEnabled = true icin ZORUNLU kutuphane
    // (flutter_local_notifications bunu istiyor). Guncel surum: 2.1.5.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // --- Appodeal Mobile Ads SDK (odullu/rewarded reklamlar) ---
    // Cekirdek SDK + Appodeal panelinde AKTIF olan ag adaptorleri.
    // 4.1.0'dan itibaren her ag adaptoru AYRI bir gradle bagimliligi
    // olarak eklenmesi gerekiyor (eskiden "full" paketi hepsini otomatik
    // getiriyordu). Bu adaptorler eklenmeden panelde ag "AÇIK" gorunse
    // bile o aga hic istek gitmiyor. Liste, Appodeal Dependencies
    // Wizard'dan (docs.appodeal.com/android/advanced/configure-mediated-networks)
    // uretildi; sadece FIILEN kullanilan aglar birakildi (AppLovin,
    // Bidmachine, UnityAds, Vungle, Yandex) — gereksiz aglar (Meta,
    // AdMob, Mintegral vb.) EKLENMEDI, cunku onlar panelde zaten
    // "KAPALI"/bagli degil.
    implementation "com.appodeal.ads.sdk:core:4.3.0"
    implementation "com.appodeal.ads.sdk.adapters:bidon:0.14.0.0"
    implementation "com.appodeal.ads.sdk.adapters:applovin:13.6.3.0"
    implementation "com.appodeal.ads.sdk.adapters:bidmachine:3.7.1.0"
    implementation "com.appodeal.ads.sdk.adapters:unity_ads:4.17.0.0"
    implementation "com.appodeal.ads.sdk.adapters:vungle:7.7.4.0"
    implementation "com.appodeal.ads.sdk.adapters:yandex:7.17.0.0"
}
