name: fastfood_merge
description: "Merge Dünyaları - Çok Dünyalı Merge Oyunu"
publish_to: 'none'
version: 2.1.7+124

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  # Ses efektleri (kisa .wav'lar, lowLatency modu). Surum BILEREK sabit:
  # daha yeni surumler Android compileSdk 35+ isteyebilir.
  audioplayers: 6.1.0
  # GERCEK fizik motoru (Box2D'nin saf Dart portu). Elle yazilmis
  # _Ball/surtunme/carpisma simulasyonunun yerini aliyor - bkz.
  # lib/services/board_physics.dart. NOT: surum numarasini pub.dev'de
  # kontrol et (bu ortamda internete cikamadigim icin dogrulayamadim,
  # `flutter pub get` hata verirse en guncel surumle degistir).
  forge2d: ^0.13.1
  # Yerel bildirimler. Surum BILEREK sabit (18+ API'si degisti, compileSdk 35 ister).
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  # Google Play Games girisi + Kayitli Oyunlar (bulut kaydi). Surum bu
  # ortamda dogrulanamadi; `flutter pub get` hata verirse guncel surumle degistir.
  games_services: ^4.0.4
  # Appodeal Mobile Ads (odullu + gecis reklami, resmi riza formu). Eski oyunda
  # (AstroFelyx) calisan surum. App Key + test modu: lib/services/ad_service.dart
  stack_appodeal_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

