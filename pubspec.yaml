  # Oyun yazi tipi: Baloo 2 (SIL OFL). Turkce karakterleri (ş ğ İ ı ö ü ç) tam destekler.
  # FontWeight.w900 istenen yerlerde en yakin agirlik olan ExtraBold(800) kullanilir.
