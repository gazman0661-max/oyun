name: Build Android (AAB + APK)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode (bos birakirsan run numarasi + VERSION_CODE_OFFSET kullanilir)"
        required: false
        default: ""
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Play'e yuklenecek versionCode, AstroFelyx'in son versionCode'undan BUYUK olmali.
      # Elle girmezsen: run numarasi + repo degiskeni VERSION_CODE_OFFSET
      # (Settings > Secrets and variables > Actions > Variables).
      BUILD_NUMBER: ${{ inputs.build_number || (github.run_number + fromJSON(vars.VERSION_CODE_OFFSET || '0')) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: Testler (basarisiz olursa build'i durdurmaz)
        continue-on-error: true
        run: flutter test

      - name: AAB (imzasiz/debug imzali; Play'e yuklemeden once bilgisayarda imzalanacak)
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER

      - name: APK (telefonda deneme)
        run: flutter build apk --release --build-number=$BUILD_NUMBER

      - name: Dosyalari yukle
        uses: actions/upload-artifact@v4
        with:
          name: world-merge-build-${{ env.BUILD_NUMBER }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
