name: Build

# Elle: Actions > Build > Run workflow  (AAB de istersen kutuyu isaretle)
# Otomatik: main/master'a push -> sadece APK.
on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Play icin IMZASIZ AAB de uret'
        type: boolean
        default: false
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      # google-services.json: repoda android/app/google-services.json varsa
      # secret GEREKMEZ. GOOGLE_SERVICES_JSON_B64 secret'i tanimliysa o kullanilir.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "HATA: google-services.json repoda yok ve secret de tanimli degil." && exit 1
          fi

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # APK: key.properties yok => Flutter'in otomatik DEBUG imzasi (telefona kurulur).
      - name: APK (debug imzali)
        run: flutter build apk --release

      - name: Imzayi dogrula
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # AAB (istege bagli): IMZASIZ uretilir, bilgisayarda jarsigner ile imzalarsin.
      - name: AAB (imzasiz)
        if: ${{ inputs.build_aab == true }}
        run: flutter build appbundle --release
        env:
          UNSIGNED_RELEASE: 'true'

      - name: AAB yukle
        if: ${{ inputs.build_aab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
