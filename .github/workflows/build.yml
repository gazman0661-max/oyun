name: Build (debug APK + release AAB)

# Ne zaman calisir:
# - main/master'a push'ta otomatik
# - Actions sekmesinden elle ("Run workflow") tetiklenebilir
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      # AGP 8.13.0 / Gradle 8.14.5 icin JDK 17 gerekli.
      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # pubspec.yaml -> flutter: ">=3.38.1". channel:stable en guncel
      # kararli surumu getirir, bu minimumu her zaman karsilar.
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Debug APK derle
        run: flutter build apk --debug

      # ONEMLI: android/app/build.gradle icinde release signingConfig,
      # android/key.properties dosyasi YOKSA bilerek null birakiliyor
      # (bkz. o dosyadaki yorumlar) — yani bu adim CI'da GERCEKTEN
      # IMZASIZ bir .aab uretir. key.properties bu repoda/CI'da
      # OLMADIGI icin (ve olmamasi gerektigi icin) burada ekstra bir
      # ayar gerekmiyor; imzalamayi kendin cmd'den (jarsigner/apksigner
      # veya "jarsigner + bundletool") yapacaksin.
      - name: Release AAB derle (imzasiz)
        run: flutter build appbundle --release

      - name: Debug APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Release AAB'yi yukle (imzasiz)
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
