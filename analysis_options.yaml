# NOT: `flutter_lints` paketi kasitli olarak DAHIL EDILMEDI. O paket, kodun
# CALISMASINI etkilemeyen uslup/oneri (lint) mesajlari uretir (orn.
# "prefer_const", "avoid_print" vb.) ve GitHub Actions / `flutter analyze`
# ciktisini "hata" gibi gorunen sarı/gri uyarilarla doldurur. Gercek
# DERLEME HATALARI (sozdizimi/tip hatalari) bu dosyadan tamamen BAGIMSIZDIR
# ve hicbir analyzer ayariyla gizlenemez/susturulamaz (zaten susturulmasi da
# doğru olmaz — derleme onlarsiz zaten basarisiz olur). Bu dosya SADECE
# stil/oneri duzeyindeki gurultuyu keser; asagidaki `errors` blogu ayrica,
# olasi kalinti/3.-parti-kaynakli tanı kodlarini da "ignore" seviyesine
# ceker ki CI ciktisi tamamen temiz kalsin.
analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'build/**'
  errors:
    todo: ignore
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    unused_import: ignore
    unused_element: ignore
    unused_field: ignore
    unused_local_variable: ignore
    unnecessary_import: ignore

linter:
  rules: {}
